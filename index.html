<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Доставка драников: Киберпанк Гродно</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stage" id="stage">
    <div class="tv-container">
      <div class="tv-top">
        <div class="tv-vent"></div>
        <div class="tv-label">DRANIK-TRON&nbsp;8000</div>
        <div class="tv-led"></div>
      </div>

      <div class="screen-frame">
        <div class="screen">
          <canvas id="gameCanvas" width="900" height="600"></canvas>

          <div class="touch-controls">
            <button id="btnJump" class="touch-btn touch-btn-jump" type="button">ПРЫЖОК</button>
            <button id="btnThrow" class="touch-btn touch-btn-throw" type="button">КІНУЦЬ</button>
          </div>
        </div>
      </div>

      <div class="tv-bottom">
        <div class="tv-speaker">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="tv-knobs">
          <div class="tv-knob"></div>
          <div class="tv-knob"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
